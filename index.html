
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Office QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 16px;
    }

    h2, p {
      text-align: center;
    }

    #reader {
      width: 100%;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      margin: 8px 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .green {
      background: #188038;
    }

    #formSection {
      display: none;
      margin-top: 20px;
    }

    #formFrame {
      width: 100%;
      height: 700px;
      border: 0;
    }
  </style>
</head>

<body>
  <h2>Post Office QR Scanner</h2>
  <p id="status">Allow camera access and scan the QR code.</p>

  <div id="reader"></div>

  <p>
    <button id="openForm" class="btn" style="display:none">
      Open Form
    </button>

    <button id="scanNext" class="btn green" style="display:none">
      Scan Next QR
    </button>
  </p>

  <section id="formSection">
    <h3>Complete Google Form</h3>
    <iframe
      id="formFrame"
      title="Post Office Entry Form"
      allow="camera">
    </iframe>
    <p>
      After submitting the form, tap Scan Next QR above.
    </p>
  </section>

  <script>
    const FORM_BASE_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSdbwzyvv0SbGIu6UtU9Q5oRsg0XXCBsguuli7ZnFYSzVb9BNw/viewform";

    const ENTRY_ID = "entry.1334642033";

    const reader = document.getElementById("reader");
    const status = document.getElementById("status");
    const openForm = document.getElementById("openForm");
    const scanNext = document.getElementById("scanNext");
    const formSection = document.getElementById("formSection");
    const formFrame = document.getElementById("formFrame");

    let scanner = null;
    let processed = false;
    let pendingUrl = "";

    async function stopScanner() {
      if (scanner) {
        try {
          await scanner.clear();
        } catch (error) {
          console.log("Scanner already stopped", error);
        }
        scanner = null;
      }

      reader.innerHTML = "";
    }

    async function startScanner() {
      await stopScanner();

      processed = false;
      pendingUrl = "";

      formSection.style.display = "none";
      formFrame.src = "about:blank";

      openForm.style.display = "none";
      scanNext.style.display = "none";
      reader.style.display = "block";

      status.textContent = "Waiting for QR code...";

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        false
      );

      scanner.render(onScanSuccess, function () {});
    }

    async function onScanSuccess(decodedText) {
      if (processed) return;
      processed = true;

      const url = new URL(FORM_BASE_URL);
      url.searchParams.set("usp", "pp_url");
      url.searchParams.set(ENTRY_ID, decodedText);

      pendingUrl = url.toString();

      status.textContent = "QR scanned successfully.";

      await stopScanner();

      reader.style.display = "none";
      openForm.style.display = "inline-block";
      scanNext.style.display = "inline-block";

      status.textContent =
        "QR scanned. Tap Open Form to complete the entry.";
    }

    openForm.addEventListener("click", function () {
      if (!pendingUrl) return;

      const url = new URL(pendingUrl);
      url.searchParams.set("embedded", "true");

      formFrame.src = url.toString();
      formSection.style.display = "block";
      openForm.style.display = "none";

      status.textContent =
        "Complete and submit the form below.";
    });

    scanNext.addEventListener("click", async function () {
      await startScanner();
    });

    startScanner();
  </script>
</body>
</html>

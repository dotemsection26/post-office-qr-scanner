
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Office QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 16px;
    }

    h2, p { text-align: center; }

    #reader { width: 100%; }

    .btn {
      display: inline-block;
      padding: 12px 16px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 6px;
      margin: 6px 3px;
      font-size: 16px;
      cursor: pointer;
    }

    .green { background: #188038; }

    #formFrame {
      width: 100%;
      height: 650px;
      border: 1px solid #ccc;
    }

    #formSection { display: none; }
  </style>
</head>

<body>
  <h2>Post Office QR Scanner</h2>
  <p id="status">Starting scanner...</p>

  <div id="reader"></div>

  <p>
    <button id="openForm" class="btn">Open Form</button>
    <button id="scanNext" class="btn green">Scan Next QR</button>
  </p>

  <section id="formSection">
    <h3>Complete Google Form</h3>
    <iframe id="formFrame" title="Google Form"></iframe>
  </section>

  <script>
    const FORM_BASE_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSdbwzyvv0SbGIu6UtU9Q5oRsg0XXCBsguuli7ZnFYSzVb9BNw/viewform";

    const ENTRY_ID = "entry.1334642033";

    const status = document.getElementById("status");
    const reader = document.getElementById("reader");
    const openForm = document.getElementById("openForm");
    const scanNext = document.getElementById("scanNext");
    const formSection = document.getElementById("formSection");
    const formFrame = document.getElementById("formFrame");

    let scanner = null;
    let processed = false;
    let formUrl = "";

    async function stopScanner() {
      if (scanner) {
        const oldScanner = scanner;
        scanner = null;
        try {
          await oldScanner.clear();
        } catch (e) {
          console.log(e);
        }
      }
      reader.innerHTML = "";
    }

    async function startScanner() {
      await stopScanner();

      processed = false;
      formUrl = "";

      reader.style.display = "block";
      formSection.style.display = "none";
      formFrame.src = "about:blank";

      status.textContent = "Point the camera at a QR code.";

      scanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: { width: 250, height: 250 } },
        false
      );

      scanner.render(
        async function (decodedText) {
          if (processed) return;
          processed = true;

          const url = new URL(FORM_BASE_URL);
          url.searchParams.set("usp", "pp_url");
          url.searchParams.set(ENTRY_ID, decodedText);
          formUrl = url.toString();

          status.textContent =
            "QR scanned. Tap Open Form to complete the entry.";

          await stopScanner();
        },
        function () {}
      );
    }

    openForm.addEventListener("click", function () {
      if (!formUrl) {
        status.textContent =
          "Please scan a QR code first. Then tap Open Form.";
        return;
      }

      const url = new URL(formUrl);
      url.searchParams.set("embedded", "true");

      formFrame.src = url.toString();
      formSection.style.display = "block";

      status.textContent =
        "Complete and submit the form below.";
    });

    scanNext.addEventListener("click", function () {
      startScanner();
    });

    startScanner();
  </script>
</body>
</html>
